name: Deploy React Assignments to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Assignment 1
        working-directory: Assignment1
        run: |
          npm ci
          npm run build -- --base=/React-Assignment/ass1/
          mkdir -p ../site/ass1
          cp -r dist/* ../site/ass1/

      - name: Build Assignment 2
        working-directory: Assignment 2/assignment-2
        run: |
          npm ci
          npm run build -- --base=/React-Assignment/ass2/
          mkdir -p ../../site/ass2
          cp -r dist/* ../../site/ass2/

      - name: Build Assignment 3
        working-directory: Assignment 3/assignment-3
        run: |
          npm ci
          npm run build -- --base=/React-Assignment/ass3/
          mkdir -p ../../site/ass3
          cp -r dist/* ../../site/ass3/

      - name: Build Assignment 4
        working-directory: Assignment 4/assignment-4
        run: |
          npm ci
          npm run build -- --base=/React-Assignment/ass4/
          mkdir -p ../../site/ass4
          cp -r dist/* ../../site/ass4/

      - name: Create landing page
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>React Assignments</title>
          </head>
          <body>
            <h1>React Assignments</h1>
            <ul>
              <li><a href="./ass1/">Assignment 1</a></li>
              <li><a href="./ass2/">Assignment 2</a></li>
              <li><a href="./ass3/">Assignment 3</a></li>
              <li><a href="./ass4/">Assignment 4</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4